server:
  # HTTP port for this demo
  port: 8080

spring:
  application:
    name: outbox-demo-kafka
  sql:
    init:
      # Load schema.sql / data.sql on startup (demo convenience)
      mode: always
  datasource:
    # Local Postgres; override for Testcontainers / docker-compose
    url: jdbc:postgresql://localhost:5432/outbox
    username: outbox
    password: outbox

outbox:
  # Master switch for the outbox starter
  enabled: true
  # Value written to locked_by on claim; use a unique id per instance in multi-pod setups
  instance-id: ${HOSTNAME:demo-kafka}
  defaults:
    persistence:
      schema:
        # create — apply outbox DDL at startup (ok for demos)
        # validate — fail if table missing (prefer in production with migrations)
        # none — do not touch schema
        mode: create
    queue:
      # memory — in-process wake-up queue (this demo)
      # redis  — shared queue; needs StringRedisTemplate
      # auto   — redis if StringRedisTemplate is present, else memory
      type: memory
      # Max event ids waiting in the wake-up queue before offer rejects
      capacity: 10000
      # Max ids drained into one publisher → OutboxSink batch
      batch-size: 250
      # How long the publisher waits for the first id before looping
      batch-wait: 50ms
    publisher:
      # false = append-only (no publisher thread)
      enabled: true
      # Claim lease duration (locked_until)
      lease-duration: 30s
      # Failed publishes before status DEAD
      max-retries: 5
    recovery:
      # Re-enqueue unpublished ACTIVE rows into the same queue
      enabled: true
      # Delay between recovery ticks (shorter in demo for faster visibility)
      interval: 5s
      batch-size: 500
  # No outbox.channels → implicit channel "default" (table outbox_events)

demo:
  kafka:
    # Topic used by KafkaOutboxSink (OutboxSink for channel default)
    topic: payments.events

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

logging:
  level:
    # Verbose outbox pipeline logs (append → offer → claim → sink → ack)
    com.kholodilin.outbox: DEBUG
