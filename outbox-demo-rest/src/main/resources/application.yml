server:
  # HTTP port for this demo (different from outbox-demo-kafka)
  port: 8081

spring:
  application:
    name: outbox-demo-rest
  sql:
    init:
      # Load schema.sql / data.sql on startup (demo convenience)
      mode: always
  datasource:
    # Local Postgres; override for Testcontainers / docker-compose
    url: jdbc:postgresql://localhost:5432/outbox
    username: outbox
    password: outbox

outbox:
  # Master switch for the outbox starter
  enabled: true
  # Value written to locked_by on claim; use a unique id per instance in multi-pod setups
  instance-id: ${HOSTNAME:demo-rest}
  defaults:
    persistence:
      schema:
        # create — apply outbox DDL at startup (ok for demos)
        # validate — fail if table missing (prefer in production with migrations)
        # none — do not touch schema
        mode: create
    queue:
      # memory — in-process wake-up queue
      # redis  — shared queue; needs StringRedisTemplate
      # auto   — redis if StringRedisTemplate is present, else memory
      type: memory
      capacity: 10000
      batch-size: 250
      batch-wait: 50ms
    publisher:
      enabled: true
      lease-duration: 30s
      # Lower than production so DEAD is easier to demo on webhook failures
      max-retries: 3
    recovery:
      enabled: true
      # Shorter interval so recovery is visible quickly in the demo
      interval: 5s
      batch-size: 500
  channels:
    # Fast path: stub sink (see PaymentsStubSink + @OutboxChannelSink("payments"))
    payments:
      persistence:
        # Dedicated table for this channel (table-per-channel)
        table-name: outbox_events_payments
      queue:
        # Smaller capacity than defaults to show backpressure sooner if needed
        capacity: 5000
    # Slower / flaky path: HTTP sink (see RestOutboxSink + @OutboxChannelSink("webhooks"))
    webhooks:
      persistence:
        table-name: outbox_events_webhooks
      publisher:
        max-retries: 3
        # Longer lease while HTTP calls may take time
        lease-duration: 60s

demo:
  webhook:
    # Target URL for RestOutboxSink (WireMock / stub in IT, or a local hook server)
    url: http://localhost:8089/hooks/payments

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

logging:
  level:
    # Verbose outbox pipeline logs (append → offer → claim → sink → ack)
    com.kholodilin.outbox: DEBUG
